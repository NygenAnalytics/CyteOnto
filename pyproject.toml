[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyteonto"
dynamic = ["version"]
description = "Semantic comparison of cell type annotations against the Cell Ontology using LLMs and embedding-based similarity."
readme = { file = "README.md", content-type = "text/markdown" }
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Nygen Analytics" },
]
keywords = [
    "bioinformatics",
    "cell-ontology",
    "cell-type",
    "llm",
    "single-cell",
    "transcriptomics",
    "cell-label"
]
dependencies = [
    "aiohttp>=3.14.0",
    "anndata>=0.12.2",
    "asyncio>=4.0.0",
    "fastapi>=0.116.1",
    "iprogress>=0.4",
    "ipykernel>=6.30.1",
    "ipython>=9.4.0",
    "jupyter>=1.1.1",
    "logfire>=4.3.3",
    "loguru>=0.7.3",
    "modal>=1.4.2",
    "mypy>=1.17.1",
    "numpy>=2.3.2",
    "owlready2>=0.48",
    "pandas>=2.3.1",
    "pyarrow>=24.0.0",
    "pydantic>=2.11.7",
    "pydantic-ai>=1.102.0,<2.0.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "python-dotenv>=1.1.1",
    "ruff>=0.12.9",
    "scikit-learn>=1.7.1",
    "tenacity>=9.1.2",
    "tomli>=2.2.1",
    "tqdm>=4.67.1",
    "xmltodict>=0.14.2",
]

[project.urls]
Homepage = "https://www.nygen.io/products/cytetype"
Documentation = "https://docs.nygen.io/CyteOnto/"
Repository = "https://github.com/NygenAnalytics/CyteOnto"
Issues = "https://github.com/NygenAnalytics/CyteOnto/issues"
Changelog = "https://github.com/NygenAnalytics/CyteOnto/releases"

[dependency-groups]
dev = [
    "seaborn>=0.13.2",
]
# Builds the MyST site and the Sphinx API reference (make -C docs html).
docs = [
    "mystmd==1.11.0",
    "jupytext>=1.19.6",
    "nbformat>=5.10",
    "myst-parser",
    "sphinx",
    "sphinx-autodoc-typehints",
    "sphinx-book-theme",
    "sphinx-copybutton",
    "pyyaml",
]

[tool.hatch.version]
path = "cyteonto/__init__.py"
[tool.hatch.build.targets.wheel]
packages = ["cyteonto"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The documentation tests import the tooling in docs/ from the repository root.
pythonpath = ["."]

# The documentation tooling in docs/ needs the docs dependency group; its tests
# check it instead.
[tool.mypy]
exclude = ["^docs/"]

[[tool.mypy.overrides]]
module = ["docs.*"]
follow_imports = "skip"
