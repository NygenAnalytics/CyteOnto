version: 1
project:
  title: CyteOnto
  short_title: Overview
  description: Compare cell type labels in Cell Ontology space with the hosted CyteOnto API
    or the cyteonto Python package, and score how similar the author's and each
    algorithm's cell types are.
  github: https://github.com/NygenAnalytics/CyteOnto
  plugins:
  - type: executable
    path: ../render_outputs.py
  exclude:
  - reference/api/**
  static_files:
  - llms.txt
  toc:
  - file: index.md
  - title: Getting started
    children:
    - file: getting-started/quickstart-api.md
      title: Quickstart (hosted API)
    - file: getting-started/installation.md
      title: Installation
    - file: getting-started/quickstart-python.md
      title: Quickstart (Python)
    - file: getting-started/how-cyteonto-works.md
      title: How CyteOnto works
  - title: Guides
    children:
    - file: guides/models-and-providers.md
      title: Models and providers
    - file: guides/compound-labels.md
      title: Compound labels
    - file: guides/similarity-metrics.md
      title: Similarity metrics
    - file: guides/caching.md
      title: Caching and runs
    - file: guides/anndata.md
      title: Labels in AnnData
    - file: guides/results.md
      title: Read the results
  - title: Reference
    children:
    - title: Python API
      url: /api/index.html
      open_in_same_tab: true
    - file: reference/http-api.md
      title: HTTP API
    - file: reference/configuration.md
      title: Environment and limits
    - file: reference/files.md
      title: Data files and formats
  - title: Support
    children:
    - file: support/troubleshooting.md
      title: Troubleshooting
    - file: support/citing.md
      title: Cite CyteOnto
    - url: https://github.com/NygenAnalytics/CyteOnto/issues
      title: Report an issue
site:
  template: https://github.com/myst-templates/book-theme/archive/23f2df5493e23dfb1d9433c8aa64c87beb4232a3.zip
  parts:
    primary_sidebar_footer: <!-- No sidebar footer. -->
    footer: '<a class="docs-home-link" href="https://docs.nygen.io/"><img class="brand-symbol" src="https://docs.nygen.io/assets/brand/logo/nygen-symbol.svg" alt="Nygen documentation home" width="32" height="32"></a>'
  options:
    folders: true
    style: https://docs.nygen.io/assets/brand/myst.css
    favicon: https://docs.nygen.io/assets/brand/logo/cyteonto.ico
    logo: https://docs.nygen.io/assets/brand/logo/cyteonto.svg
    logo_dark: https://docs.nygen.io/assets/brand/logo/cyteonto.svg
    logo_alt: CyteOnto
    logo_text: CyteOnto
    hide_authors: true
